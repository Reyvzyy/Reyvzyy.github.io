<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ cá</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #006994;
            background-image: url("images/aquarium.jpg");
            background-size: cover;
            background-position: center;
            height: 100vh;
            position: relative;
        }
        .home-link {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 100;
            background: #ffffff;
            color: #004d73;
            padding: 8px 14px;
            border-radius: 6px;
            text-decoration: none;
            font-family: Arial, sans-serif;
            font-weight: bold;
        }
        .fish {
            position: absolute;
            width: 160px;
            animation: swimLeftToRight 14s linear infinite;
        }
        .fish-1 {
            top: 18%;
            animation-duration: 12s;
        }
        .fish-2 {
            top: 42%;
            width: 140px;
            animation-duration: 16s;
            animation-delay: -5s;
        }
        .fish-3 {
            top: 68%;
            width: 170px;
            animation-duration: 20s;
            animation-delay: -9s;
        }
        .diver {
            position: absolute;
            width: 130px;
            animation: diveFloat 7s ease-in-out infinite alternate;
        }
        .diver-1 {
            left: 18%;
            top: 12%;
            animation-duration: 6s;
        }
        .diver-2 {
            left: 48%;
            top: 30%;
            animation-duration: 8s;
            animation-delay: -2s;
        }
        .diver-3 {
            left: 72%;
            top: 20%;
            animation-duration: 7s;
            animation-delay: -4s;
        }
        .bubble {
            position: absolute;
            bottom: -40px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.8);
            background: rgba(255, 255, 255, 0.25);
            animation: riseUp 8s infinite ease-in;
        }
        .bubble-1 { left: 15%; animation-duration: 6s; }
        .bubble-2 { left: 35%; animation-duration: 8s; animation-delay: 1s; }
        .bubble-3 { left: 55%; animation-duration: 7s; animation-delay: 2s; }
        .bubble-4 { left: 75%; animation-duration: 9s; animation-delay: 3s; }
        @keyframes swimLeftToRight {
            0% { left: -200px; }
            100% { left: 110%; }
        }
        @keyframes diveFloat {
            0% { transform: translateY(0px); }
            100% { transform: translateY(90px); }
        }
        @keyframes riseUp {
            0% { bottom: -40px; opacity: 0.9; }
            100% { bottom: 110%; opacity: 0; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="home-link">Trang chủ</a>
    <img src="shark.png" alt="Cá mập" class="fish fish-1">
    <img src="goldFishSchool.png" alt="Đàn cá" class="fish fish-2">
    <img src="turtle.png" alt="Rùa biển" class="fish fish-3">
    <img src="diver1.png" alt="Thợ lặn 1" class="diver diver-1">
    <img src="diver2.png" alt="Thợ lặn 2" class="diver diver-2">
    <img src="diver3.png" alt="Thợ lặn 3" class="diver diver-3">
    <div class="bubble bubble-1"></div>
    <div class="bubble bubble-2"></div>
    <div class="bubble bubble-3"></div>
    <div class="bubble bubble-4"></div>
</body>
</html>
